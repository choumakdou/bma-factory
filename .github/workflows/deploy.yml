# Auto-deploy to Cloud Run on every push to master.
#
# Required GitHub secret:
#   GCP_SA_KEY    — service account JSON for a deploy identity with
#                   roles: Cloud Build Editor, Cloud Run Admin,
#                   Service Account User, Storage Object Admin.
#
# Manual trigger: GitHub → Actions tab → "deploy" → Run workflow.
# Auto trigger:   every push to the master branch.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: bma-factory
  REGION: asia-east2
  SERVICE: bma-factory-demo
  RUNTIME_SA: service-ac1@bma-factory.iam.gserviceaccount.com
  SECRET_NAME: engine-sa-key
  TOKEN_SECRET: user-oauth-token
  IMAGE: gcr.io/bma-factory/bma-factory-demo
  # The Shared Drive the engine writes to. Without this set, the engine
  # falls back to the SA's Drive root — which fails on personal Google
  # accounts with "Service Accounts do not have storage quota".
  # Replace with the Shared Drive ID once Bobby creates one.
  VF_DRIVE_ID: ${{ vars.VF_DRIVE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build container image with Docker
        # Bypass Cloud Build (and its auto-created bucket) by building on the
        # runner and pushing directly to gcr.io. The deployer SA only needs
        # Storage Object Admin on the gcr.io bucket, which we already have.
        run: |
          echo "==> Building ${{ env.IMAGE }} via Docker"
          docker build \
            --tag "${{ env.IMAGE }}" \
            --tag "${{ env.IMAGE }}:sha-${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.repository }}" \
            .
          echo "==> Pushing to gcr.io"
          docker push "${{ env.IMAGE }}"

      - name: Deploy to Cloud Run
        run: |
          echo "==> Deploying ${{ env.SERVICE }} to ${{ env.REGION }}"

          # Build comma-separated env vars (non-sensitive only).
          # The Google OAuth client ID and client secret are technically
          # public (they live in compiled desktop app code), so passing
          # them as plain env vars is acceptable for a single-tenant demo.
          ENV_LIST=()
          if [ -n "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" ]; then
            ENV_LIST+=("GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}")
          fi
          if [ -n "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" ]; then
            ENV_LIST+=("GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}")
          fi
          if [ -n "${{ vars.VF_DRIVE_ID }}" ]; then
            ENV_LIST+=("VF_DRIVE_ID=${{ vars.VF_DRIVE_ID }}")
          fi
          if [ -n "${{ secrets.VF_DIAG_TOKEN }}" ]; then
            ENV_LIST+=("VF_DIAG_TOKEN=${{ secrets.VF_DIAG_TOKEN }}")
          fi
          ENV_LIST+=("VF_TOKEN_SECRET=${{ env.TOKEN_SECRET }}")
          ENV_LIST+=("GOOGLE_CLOUD_PROJECT=${{ env.PROJECT }}")
          if [ ${#ENV_LIST[@]} -gt 0 ]; then
            ENV_CSV=$(IFS=,; echo "${ENV_LIST[*]}")
          else
            ENV_CSV=""
          fi
          echo "==> env vars: $ENV_CSV"

          # The service-account key IS mounted: the app uses its own identity
          # to store the valuer's OAuth refresh token in Secret Manager, so
          # the sign-in survives Cloud Run scaling the container to zero.
          # Drive writes still use the valuer's OAuth credentials.
          echo "==> Deploying (SA key mounted for Secret Manager token storage)"
          # The explicit TCP startup probe gives the container up to
          # 240s (period 2s x failureThreshold 120) to open PORT 8080
          # instead of Cloud Run's default 240 x 1s window, and it
          # removes the HTTP dependency on the app answering /.
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "${{ env.RUNTIME_SA }}" \
            --update-secrets "GOOGLE_APPLICATION_CREDENTIALS=${{ env.SECRET_NAME }}:latest" \
            ${ENV_CSV:+--set-env-vars "$ENV_CSV"} \
            --allow-unauthenticated \
            --port 8080 \
            --startup-probe "tcpSocket.port=8080,initialDelaySeconds=0,periodSeconds=2,timeoutSeconds=1,failureThreshold=120" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 80 \
            --timeout 60 \
            --project "${{ env.PROJECT }}" \
            --quiet

      - name: Show deployed URL
        if: success()
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --format 'value(status.url)')
          echo ""
          echo "============================================================"
          echo "  Deployed: ${{ env.SERVICE }}"
          echo "  URL:      $URL"
          echo "  Case:     $URL/case/bel-air-m2"
          echo "============================================================"
